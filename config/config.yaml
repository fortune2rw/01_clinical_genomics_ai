  cleaned_mut_metadata : "data/processed/genomics_cleaned.csv"
  top_genes: "outputs/tables/top_mutated_genes.csv"
  mutation_counts: "outputs/tables/mutation_counts_per_patient.csv"
  variant_class: "outputs/tables/variant_classification_summary.csv"
  cli_mut_merged: "data/processed/clinical_genomics_merged.csv"
  id_matching_sum: "outputs/tables/id_matching_summary.csv"
  mutation_burden_summary: "outputs/tables/mutation_burden_summary.csv"
  clinical_genomic_summary: "outputs/tables/clinical_genomic_summary.csv"
  mutation_burden_summary: "outputs/tables/mutation_burden_summary.csv"
  clinical_genomic_summary: "outputs/tables/clinical_genomic_summary.csv"
  ml_feature_table: "data/processed/ml_feature_table.csv"
  model_performance_summary: "outputs/tables/model_performance_summary.csv"
  feature_importance: "outputs/tables/feature_importance.csv"

# Model file output
model_output_paths:
  baseline_model: "outputs/models/baseline_model.pk1"
  model_performance_summary: "outputs/tables/model_performance_summary.csv"
  feature_importance: "outputs/tables/feature_importance.csv"
  
 # Model output paths
model_output_paths:
  baseline_model: "outputs/models/baseline_model.pk1"


# Figures output paths
figure_output_paths:
  top_genes_barplot: "outputs/figures/top-mutated_genes_barplot.png"
  variant_classification_dist: "outputs/figures/variant_classification_distribution.png"
  mutations_per_patient: "outputs/figures/mutations_per_patient.png"
